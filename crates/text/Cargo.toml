[package]
name = "text"
version = "0.1.0"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
path = "src/text.rs"
doctest = false

# Silence clippy style lints that fire on the vendored Zed source. Editing the
# `.rs` to satisfy them would diverge from upstream (future Zed reads must line
# up); we keep the logic verbatim and allow the lints here, as for rope/sum_tree.
[lints.clippy]
init_numbered_fields = "allow"
should_implement_trait = "allow"
too_many_arguments = "allow"
type_complexity = "allow"        # `get_random_edits`'s return tuple (test-support helper)
wrong_self_convention = "allow"

# Mirrors Zed's `text`: enabling `test-support` exposes the vendored property-
# test helpers (`RandomCharIter`-based generators, `edit_via_marked_text`) and so
# pulls in `rand` and `util`'s matching surface. The gpui-based `mod tests` Zed
# ships under this gate was dropped during vendoring (it needs `#[gpui::test]`,
# and this layer is gpui-free, exactly as Zed's own `text` lib is) — only the
# gpui-free helper *surface* is reproduced here.
[features]
test-support = ["rand", "util/test-support"]

[dependencies]
anyhow = "1.0.86"
clock = { path = "../clock" }
collections = { path = "../collections" }
log = "0.4"
parking_lot = "0.12.1"
# Optional, matching Zed: only built for the `test-support` surface / tests.
rand = { version = "0.9", optional = true }
rope = { path = "../rope" }
smallvec = { version = "1.6", features = ["union", "const_new"] }
sum_tree = { path = "../sum_tree" }
util = { path = "../util-shim" }

# The vendored `cfg(any(test, feature = "test-support"))` helpers reference
# `rand` and `util`'s `test-support` surface; make both available to this crate's
# own `cargo test` build (Zed wires these identically in its `[dev-dependencies]`).
[dev-dependencies]
rand = "0.9"
util = { path = "../util-shim", features = ["test-support"] }
